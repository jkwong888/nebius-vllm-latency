[project]
name = "llm-latency-test"
version = "0.1.0"
description = "Direct vLLM benchmarks with AIPerf, OpenCode, and HTTP round-trip measurements"
requires-python = ">=3.11,<3.14"
dependencies = []

[project.optional-dependencies]
test = ["pytest==8.4.2", "PyYAML==6.0.3"]
benchmark = ["aiperf==0.13.0", "transformers==5.5.0"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.uv.workspace]
members = [
    "vpngw",
]
