apiVersion: batch/v1
kind: Job
metadata:
  name: gpu-check
  namespace: llm-latency
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      runtimeClassName: nvidia
      containers:
        - name: check
          image: nvidia/cuda:13.0.0-base-ubuntu24.04
          command: [nvidia-smi]
          resources:
            limits:
              nvidia.com/gpu: 1
