# K3s's packaged Helm controller creates the Helm installation Job.
apiVersion: helm.cattle.io/v1
kind: HelmChart
metadata:
  name: cert-manager
  namespace: kube-system
spec:
  chart: cert-manager
  repo: https://charts.jetstack.io
  version: v1.20.4
  targetNamespace: cert-manager
  createNamespace: true
  timeout: 300s
  failurePolicy: abort
  valuesContent: |-
    crds:
      enabled: true
