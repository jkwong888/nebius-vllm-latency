# K3s's packaged Helm controller consumes this YAML. Terraform does not manage it.
apiVersion: helm.cattle.io/v1
kind: HelmChartConfig
metadata:
  name: traefik
  namespace: kube-system
spec:
  valuesContent: |-
    hostNetwork: true
    service:
      enabled: false
    deployment:
      replicas: 1
      dnsPolicy: ClusterFirstWithHostNet
    updateStrategy:
      type: Recreate
      rollingUpdate: null
    # Host networking uses the host's privileged-port threshold. UID 0 keeps
    # NET_BIND_SERVICE effective across the image's entrypoint exec.
    podSecurityContext:
      runAsUser: 0
      runAsGroup: 65532
      runAsNonRoot: false
    securityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop: [ALL]
        add: [NET_BIND_SERVICE]
    ports:
      web:
        port: 80
        hostPort: 80
        expose:
          default: false
      websecure:
        port: 443
        hostPort: 443
        expose:
          default: false
    additionalArguments:
      - --entryPoints.tunnel.address=127.0.0.1:8088/tcp
      - --entryPoints.web.transport.respondingTimeouts.readTimeout=600s
      - --entryPoints.web.transport.respondingTimeouts.writeTimeout=0s
      - --entryPoints.websecure.transport.respondingTimeouts.readTimeout=600s
      - --entryPoints.websecure.transport.respondingTimeouts.writeTimeout=0s
      - --entryPoints.tunnel.transport.respondingTimeouts.readTimeout=600s
      - --entryPoints.tunnel.transport.respondingTimeouts.writeTimeout=0s
