apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: llm-tunnel
  namespace: llm-latency
spec:
  entryPoints: [tunnel]
  routes:
    - kind: Rule
      match: PathPrefix(`/v1/`) || Path(`/health`) || Path(`/metrics`)
      services:
        - name: vllm
          port: 8080
          responseForwarding:
            flushInterval: 1ms
